<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Rules & Regulations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* PAGE CONTAINER */
    .pages-container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      overflow: hidden;
    }

    /* EACH PAGE */
    .page {
      width: 100%;
      text-align: center;
      display: none;
    }

    .page.active {
      display: block;
      animation: slideInRight 0.45s ease;
    }

    .page.slide-left {
      animation: slideOutLeft 0.45s ease;
    }

    .page.slide-from-left {
      animation: slideInLeft 0.45s ease;
    }

    /* NEXT ANIMATION */
    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes slideOutLeft {
      from {
        opacity: 1;
        transform: translateX(0);
      }

      to {
        opacity: 0;
        transform: translateX(-100%);
      }
    }

    /* PREVIOUS ANIMATION */
    @keyframes slideInLeft {
      from {
        opacity: 0;
        transform: translateX(-100%);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    /* RULES IMAGE */
    .rules-image {
      width: 100%;
      max-width: 900px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    /* BUTTONS */
    .buttons {
      max-width: 900px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    button:active {
      transform: translateY(0);
    }

    .next-btn {
      background: #1976d2;
      color: white;
    }

    .agree-btn {
      background: #2e7d32;
      color: white;
    }

    .back-btn {
      background: #555;
      color: white;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      body {
        padding: 8px;
      }

      .pages-container {
        max-width: 100%;
      }

      .rules-image {
        max-width: 100%;
        border-radius: 7px;
      }

      .buttons {
        margin-top: 12px;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 13px 15px;
        font-size: 16px;
      }

    }
  </style>
</head>

<body>

  <div class="pages-container">

    <!-- PAGE 1 -->

    <div class="page active" id="page1">

      <img
        src="rules-page-1.jpg"
        alt="CHF Rules and Regulations - Page 1"
        class="rules-image"
      >

      <div class="buttons">

        <button class="back-btn" onclick="goHome()">
          ← Back
        </button>

        <button class="next-btn" onclick="showPage2()">
          Next →
        </button>

      </div>

    </div>


    <!-- PAGE 2 -->

    <div class="page" id="page2">

      <img
        src="rules-page-2.jpg"
        alt="CHF Rules and Regulations - Page 2"
        class="rules-image"
      >

      <div class="buttons">

        <button class="back-btn" onclick="showPage1()">
          ← Previous
        </button>

        <button class="agree-btn" onclick="continueRegistration()">
          Agree & Continue →
        </button>

      </div>

    </div>

  </div>


  <script>

    function showPage2() {

      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");

      page1.classList.remove("active");
      page1.classList.add("slide-left");

      setTimeout(function() {

        page1.style.display = "none";
        page1.classList.remove("slide-left");

        page2.style.display = "block";
        page2.classList.add("active");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }, 400);

    }


    function showPage1() {

      const page1 = document.getElementById("page1");
      const page2 = document.getElementById("page2");

      page2.classList.remove("active");
      page2.classList.add("slide-left");

      setTimeout(function() {

        page2.style.display = "none";
        page2.classList.remove("slide-left");

        page1.style.display = "block";
        page1.classList.add("slide-from-left");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }, 400);

    }


    function continueRegistration() {

      window.location.href = "registration.html";

    }


    function goHome() {

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
