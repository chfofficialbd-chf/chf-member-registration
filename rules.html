<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Rules & Regulations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family: Arial, sans-serif;
    }

    .page {
      display: none;
      width: 100%;
      text-align: center;
    }

    .page.active {
      display: block;
    }

    .rules-image {
      width: 100%;
      max-width: 1100px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .buttons {
      max-width: 1100px;
      margin: 20px auto;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 13px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .next-btn {
      background: #1976d2;
      color: white;
    }

    .agree-btn {
      background: #2e7d32;
      color: white;
    }

    .back-btn {
      background: #555;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    @media (max-width: 600px) {

      body {
        padding: 8px;
      }

      .buttons {
        margin-top: 12px;
      }

      button {
        width: 100%;
        padding: 13px 15px;
      }

    }
  </style>
</head>

<body>

  <!-- RULES PAGE 1 -->

  <div class="page active" id="page1">

    <img
      src="rules-page-1.jpg"
      alt="CHF Rules and Regulations - Page 1"
      class="rules-image"
    >

    <div class="buttons">

      <button class="back-btn" onclick="goHome()">
        Back to Home
      </button>

      <button class="next-btn" onclick="showPage2()">
        Next
      </button>

    </div>

  </div>


  <!-- RULES PAGE 2 -->

  <div class="page" id="page2">

    <img
      src="rules-page-2.jpg"
      alt="CHF Rules and Regulations - Page 2"
      class="rules-image"
    >

    <div class="buttons">

      <button class="back-btn" onclick="showPage1()">
        Previous
      </button>

      <button class="agree-btn" onclick="continueRegistration()">
        Agree & Continue
      </button>

    </div>

  </div>


  <script>

    function showPage2() {

      document.getElementById("page1").classList.remove("active");

      document.getElementById("page2").classList.add("active");

      window.scrollTo(0, 0);

    }


    function showPage1() {

      document.getElementById("page2").classList.remove("active");

      document.getElementById("page1").classList.add("active");

      window.scrollTo(0, 0);

    }


    function continueRegistration() {

      window.location.href = "registration.html";

    }


    function goHome() {

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
