<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Rules & Regulations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f5f7;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .slider {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      overflow: hidden;
      position: relative;
    }

    .slides {
      display: flex;
      width: 200%;
      transition: transform 0.6s ease-in-out;
    }

    .page {
      width: 50%;
      flex-shrink: 0;
      text-align: center;
    }

    .rules-image {
      width: 100%;
      max-width: 820px;
      height: auto;
      display: block;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.14);
    }

    .buttons {
      margin: 18px auto 5px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 26px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .next-btn {
      background: #1976d2;
      color: white;
    }

    .agree-btn {
      background: #2e7d32;
      color: white;
    }

    .back-btn {
      background: #555;
      color: white;
    }

    @media (max-width: 600px) {

      body {
        padding: 8px;
      }

      .slider {
        max-width: 100%;
      }

      .rules-image {
        max-width: 100%;
        border-radius: 6px;
      }

      .buttons {
        margin-top: 12px;
        gap: 8px;
      }

      button {
        width: 100%;
        padding: 12px 15px;
      }

    }
  </style>
</head>

<body>

  <div class="slider">

    <div class="slides" id="slides">

      <!-- PAGE 1 -->

      <div class="page">

        <img
          src="rules-page-1.jpg"
          alt="CHF Rules and Regulations - Page 1"
          class="rules-image"
        >

        <div class="buttons">

          <button class="back-btn" onclick="goHome()">
            ← Back
          </button>

          <button class="next-btn" onclick="showPage2()">
            Next →
          </button>

        </div>

      </div>


      <!-- PAGE 2 -->

      <div class="page">

        <img
          src="rules-page-2.jpg"
          alt="CHF Rules and Regulations - Page 2"
          class="rules-image"
        >

        <div class="buttons">

          <button class="back-btn" onclick="showPage1()">
            ← Previous
          </button>

          <button class="agree-btn" onclick="continueRegistration()">
            Agree & Continue →
          </button>

        </div>

      </div>

    </div>

  </div>


  <script>

    function showPage2() {

      document.getElementById("slides").style.transform =
        "translateX(-50%)";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function showPage1() {

      document.getElementById("slides").style.transform =
        "translateX(0%)";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function continueRegistration() {

      window.location.href = "registration.html";

    }


    function goHome() {

      window.location.href = "index.html";

    }

  </script>

</body>
</html>
