<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Member Registration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #e8eef5);
      padding: 30px 15px;
    }

    .form-container {
      max-width: 700px;
      margin: auto;
      background: #ffffff;
      padding: 35px 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      color: #222;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 15px;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      color: #1769aa;
      margin: 28px 0 18px;
      padding-bottom: 8px;
      border-bottom: 2px solid #e5e5e5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    .required {
      color: red;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #1769aa;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .fee-options {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .fee-option {
      flex: 1;
      min-width: 130px;
    }

    .fee-option input {
      display: none;
    }

    .fee-option label {
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 13px;
      text-align: center;
      cursor: pointer;
      font-weight: normal;
    }

    .fee-option input:checked + label {
      background: #1769aa;
      color: white;
      border-color: #1769aa;
    }

    .photo-box {
      border: 2px dashed #bbb;
      border-radius: 12px;
      padding: 25px;
      text-align: center;
    }

    .photo-box input {
      border: none;
      padding: 5px;
    }

    .submit-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1769aa;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .submit-btn:hover {
      background: #0d4f82;
    }

    .back-btn {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #555;
      text-decoration: none;
    }

    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <div class="header">
      <h1>CHF Member Registration</h1>
      <p>Charity Hope Foundation</p>
    </div>

    <!-- Personal Information -->
    <div class="section-title">
      Personal Information
    </div>

    <div class="field">
      <label>
        Name <span class="required">*</span>
      </label>

      <input
        type="text"
        name="name"
        placeholder="Enter your full name"
        required>
    </div>

    <div class="field">
      <label>
        Date of Birth <span class="required">*</span>
      </label>

      <input
        type="date"
        name="dob"
        required>
    </div>

    <div class="field">
      <label>
        Gender <span class="required">*</span>
      </label>

      <select name="gender" required>
        <option value="">Select Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="field">
      <label>
        Blood Group
      </label>

      <select name="bloodGroup">
        <option value="">Select Blood Group</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>
    </div>

    <div class="field">
      <label>
        Address <span class="required">*</span>
      </label>

      <textarea
        name="address"
        placeholder="Enter your full address"
        required></textarea>
    </div>

    <!-- Contact Information -->
    <div class="section-title">
      Contact Information
    </div>

    <div class="field">
      <label>
        Mobile Number <span class="required">*</span>
      </label>

      <input
        type="tel"
        name="mobile"
        placeholder="Enter your mobile number"
        required>
    </div>

    <div class="field">
      <label>
        Email Address <span class="required">*</span>
      </label>

      <input
        type="email"
        name="email"
        placeholder="Enter your email address"
        required>
    </div>

    <!-- Membership Information -->
    <div class="section-title">
      Membership Information
    </div>

    <div class="field">
      <label>
        Reference
      </label>

      <input
        type="text"
        name="reference"
        placeholder="Reference person's name">
    </div>

    <div class="field">
      <label>
        ID Card Fee <span class="required">*</span>
      </label>

      <div class="fee-options">

        <div class="fee-option">
          <input
            type="radio"
            id="feeYes"
            name="idFee"
            value="Yes"
            required>

          <label for="feeYes">
            Yes
          </label>
        </div>

        <div class="fee-option">
          <input
            type="radio"
            id="feeNo"
            name="idFee"
            value="No">

          <label for="feeNo">
            No
          </label>
        </div>

        <div class="fee-option">
          <input
            type="radio"
            id="feeWillPay"
            name="idFee"
            value="Will be paid">

          <label for="feeWillPay">
            Will be paid
          </label>
        </div>

      </div>
    </div>

    <!-- Photo -->
    <div class="section-title">
      Passport Size Picture
    </div>

    <div class="field photo-box">

      <label>
        Upload Passport Size Picture
        <span class="required">*</span>
      </label>

      <input
        type="file"
        name="photo"
        accept="image/*"
        required>

    </div>

    <button type="button" class="submit-btn">
      Submit Registration
    </button>

    <a href="index.html" class="back-btn">
      ← Back to Home
    </a>

  </div>

</body>
</html>
