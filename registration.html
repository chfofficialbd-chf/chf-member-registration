<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CHF Member Registration</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(circle at top left, #dff3ff 0%, transparent 35%),
        radial-gradient(circle at bottom right, #eee3ff 0%, transparent 35%),
        linear-gradient(135deg, #f7fbff, #edf3f9);

      padding: 25px 15px;

    }


    /* =========================
       MAIN CONTAINER
    ========================= */

    .form-container {

      max-width: 700px;

      margin: auto;

      background: rgba(255,255,255,0.97);

      padding: 28px 25px;

      border-radius: 24px;

      box-shadow:
        0 20px 50px rgba(30,70,110,0.14),
        0 5px 15px rgba(30,70,110,0.06);

    }


    /* =========================
       HEADER
    ========================= */

    .header {

      text-align: center;

      padding: 5px 10px 25px;

      margin-bottom: 8px;

    }


    .logo-circle {

      width: 82px;
      height: 82px;

      margin: 0 auto 13px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #1769aa,
          #48a9e8,
          #7b61ff
        );

      padding: 3px;

      box-shadow:
        0 8px 22px rgba(23,105,170,0.25);

    }


    .logo {

      width: 100%;
      height: 100%;

      object-fit: contain;

      border-radius: 50%;

      background: white;

      display: block;

    }


    .header h1 {

      font-size: 26px;

      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          #1769aa,
          #5145cd,
          #1769aa
        );

      -webkit-background-clip: text;

      -webkit-text-fill-color: transparent;

      margin-bottom: 6px;

    }


    .header p {

      color: #5b6675;

      font-size: 14px;

      font-weight: 600;

      letter-spacing: 0.5px;

    }


    .header-line {

      width: 75px;
      height: 3px;

      margin: 13px auto 0;

      border-radius: 10px;

      background:
        linear-gradient(
          90deg,
          #1769aa,
          #7b61ff,
          #1769aa
        );

    }


    /* =========================
       SECTION TITLE
    ========================= */

    .section-title {

      font-size: 18px;

      font-weight: bold;

      color: #1769aa;

      margin: 28px 0 17px;

      padding: 12px 15px;

      border-radius: 10px;

      border-left: 5px solid #1769aa;

      background:
        linear-gradient(
          90deg,
          #eaf5ff,
          #f6f2ff
        );

      box-shadow:
        0 3px 10px rgba(23,105,170,0.05);

    }


    /* =========================
       FIELD CARD
    ========================= */

    .field {

      margin-bottom: 16px;

      padding: 14px;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #f8fbff,
          #fdfbff
        );

      border: 1px solid #e5eaf2;

      box-shadow:
        0 3px 10px rgba(40,70,100,0.04);

      transition: all 0.25s ease;

    }


    .field:hover {

      border-color: #c8d9ed;

      box-shadow:
        0 6px 16px rgba(40,70,100,0.08);

    }


    /* =========================
       LABEL
    ========================= */

    label {

      display: block;

      font-weight: bold;

      color: #334155;

      margin-bottom: 8px;

      font-size: 14px;

    }


    .required {

      color: #e53935;

      font-size: 15px;

    }


    /* =========================
       INPUTS
    ========================= */

    input,
    select,
    textarea {

      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ccd7e3;

      border-radius: 9px;

      font-size: 15px;

      outline: none;

      background: white;

      color: #263445;

      transition: all 0.25s ease;

    }


    input::placeholder,
    textarea::placeholder {

      color: #9aa6b2;

    }


    input:hover,
    select:hover,
    textarea:hover {

      border-color: #9bb8d5;

    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color: #1769aa;

      background: #ffffff;

      box-shadow:
        0 0 0 3px rgba(23,105,170,0.10),
        0 4px 12px rgba(23,105,170,0.06);

    }


    textarea {

      min-height: 100px;

      resize: vertical;

    }


    /* =========================
       FEE OPTIONS
    ========================= */

    .fee-options {

      display: flex;

      gap: 10px;

      flex-wrap: wrap;

    }


    .fee-option {

      flex: 1;

      min-width: 120px;

    }


    .fee-option input {

      display: none;

    }


    .fee-option label {

      border: 1px solid #ccd7e3;

      border-radius: 9px;

      padding: 13px 8px;

      text-align: center;

      cursor: pointer;

      font-weight: 600;

      background: white;

      color: #526171;

      transition: all 0.25s ease;

      margin: 0;

    }


    .fee-option label:hover {

      border-color: #7da9d0;

      background: #f3f9ff;

    }


    .fee-option input:checked + label {

      background:
        linear-gradient(
          135deg,
          #1769aa,
          #5145cd
        );

      color: white;

      border-color: transparent;

      box-shadow:
        0 6px 15px rgba(23,105,170,0.20);

    }


    /* =========================
       PHOTO BOX
    ========================= */

    .photo-box {

      border: 2px dashed #9bb8d5;

      border-radius: 14px;

      padding: 23px 18px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #f3faff,
          #faf7ff
        );

    }


    .photo-box label {

      color: #1769aa;

    }


    .photo-box input {

      border: none;

      padding: 5px;

      background: transparent;

      box-shadow: none;

    }


    /* =========================
       SUBMIT BUTTON
    ========================= */

    .submit-btn {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #1769aa,
          #5145cd
        );

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 17px;

      box-shadow:
        0 10px 25px rgba(23,105,170,0.23);

      transition: all 0.25s ease;

    }


    .submit-btn:hover {

      transform: translateY(-2px);

      box-shadow:
        0 14px 30px rgba(23,105,170,0.28);

    }


    .submit-btn:active {

      transform: translateY(0);

    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-btn {

      display: block;

      text-align: center;

      margin-top: 18px;

      color: #64748b;

      text-decoration: none;

      font-size: 14px;

    }


    .back-btn:hover {

      color: #1769aa;

      text-decoration: underline;

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {

        padding: 10px;

      }


      .form-container {

        padding: 22px 14px;

        border-radius: 18px;

      }


      .logo-circle {

        width: 70px;
        height: 70px;

      }


      .header h1 {

        font-size: 23px;

      }


      .header p {

        font-size: 13px;

      }


      .section-title {

        font-size: 17px;

      }


      .field {

        padding: 12px;

      }


      .fee-options {

        flex-direction: column;

      }


      .fee-option {

        width: 100%;

      }

    }

  </style>
</head>


<body>


  <div class="form-container">


    <!-- HEADER -->

    <div class="header">


      <div class="logo-circle">

        <img
          src="https://raw.githubusercontent.com/chfofficialbd-chf/chf-member-registration/main/Logo%20CHF.jpg"
          alt="CHF Logo"
          class="logo"
        >

      </div>


      <h1>
        CHF Member Registration
      </h1>


      <p>
        Charity Hope Foundation-CHF
      </p>


      <div class="header-line"></div>


    </div>


    <!-- PERSONAL INFORMATION -->

    <div class="section-title">
      Personal Information
    </div>


    <div class="field">

      <label>
        Name <span class="required">*</span>
      </label>

      <input
        type="text"
        name="name"
        placeholder="Enter your full name"
        required>

    </div>


    <div class="field">

      <label>
        Date of Birth <span class="required">*</span>
      </label>

      <input
        type="date"
        name="dob"
        required>

    </div>


    <div class="field">

      <label>
        Gender <span class="required">*</span>
      </label>

      <select name="gender" required>

        <option value="">
          Select Gender
        </option>

        <option value="Male">
          Male
        </option>

        <option value="Female">
          Female
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <div class="field">

      <label>
        Blood Group
      </label>

      <select name="bloodGroup">

        <option value="">
          Select Blood Group
        </option>

        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>

      </select>

    </div>


    <div class="field">

      <label>
        Address <span class="required">*</span>
      </label>

      <textarea
        name="address"
        placeholder="Enter your full address"
        required></textarea>

    </div>


    <!-- CONTACT INFORMATION -->

    <div class="section-title">
      Contact Information
    </div>


    <div class="field">

      <label>
        Mobile Number <span class="required">*</span>
      </label>

      <input
        type="tel"
        name="mobile"
        placeholder="Enter your mobile number"
        required>

    </div>


    <div class="field">

      <label>
        Email Address <span class="required">*</span>
      </label>

      <input
        type="email"
        name="email"
        placeholder="Enter your email address"
        required>

    </div>


    <!-- MEMBERSHIP INFORMATION -->

    <div class="section-title">
      Membership Information
    </div>


    <div class="field">

      <label>
        Reference
      </label>

      <input
        type="text"
        name="reference"
        placeholder="Reference person's name">

    </div>


    <div class="field">

      <label>
        ID Card Fee <span class="required">*</span>
      </label>


      <div class="fee-options">


        <div class="fee-option">

          <input
            type="radio"
            id="feeYes"
            name="idFee"
            value="Yes"
            required>

          <label for="feeYes">
            Yes
          </label>

        </div>


        <div class="fee-option">

          <input
            type="radio"
            id="feeNo"
            name="idFee"
            value="No">

          <label for="feeNo">
            No
          </label>

        </div>


        <div class="fee-option">

          <input
            type="radio"
            id="feeWillPay"
            name="idFee"
            value="Will be paid">

          <label for="feeWillPay">
            Will be paid
          </label>

        </div>


      </div>

    </div>


    <!-- PHOTO -->

    <div class="section-title">
      Passport Size Picture
    </div>


    <div class="field photo-box">

      <label>

        Upload Passport Size Picture

        <span class="required">*</span>

      </label>


      <input
        type="file"
        name="photo"
        accept="image/*"
        required>

    </div>


    <!-- SUBMIT -->

    <button
      type="button"
      class="submit-btn">

      Submit Registration

    </button>


    <script>

      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbwoEWioiHARlhVql9tQ3svKHiDiaEVosr_Kq9_UDpUxd9z5EovCZJW0PfIxcDxtNu-2/exec";


      document
        .querySelector(".submit-btn")
        .addEventListener("click", async function () {


          const data = {

            name:
              document.querySelector(
                'input[name="name"]'
              ).value,


            dob:
              document.querySelector(
                'input[name="dob"]'
              ).value,


            gender:
              document.querySelector(
                'select[name="gender"]'
              ).value,


            bloodGroup:
              document.querySelector(
                'select[name="bloodGroup"]'
              ).value,


            address:
              document.querySelector(
                'textarea[name="address"]'
              ).value,


            mobile:
              document.querySelector(
                'input[name="mobile"]'
              ).value,


            email:
              document.querySelector(
                'input[name="email"]'
              ).value,


            reference:
              document.querySelector(
                'input[name="reference"]'
              ).value,


            idFee:
              document.querySelector(
                'input[name="idFee"]:checked'
              )?.value || "",


            photo: ""

          };


          try {

            await fetch(
              SCRIPT_URL,
              {
                method: "POST",
                body: JSON.stringify(data)
              }
            );


            alert(
              "Registration submitted successfully!"
            );


          } catch (error) {

            alert(
              "Submission failed. Please try again."
            );

          }

        });

    </script>


    <a
      href="index.html"
      class="back-btn">

      ← Back to Home

    </a>


  </div>


</body>
</html>
