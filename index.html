<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charity Hope Foundation - CHF</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa, #e8eef5);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 600px;
      background: white;
      border-radius: 20px;
      padding: 45px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .logo-placeholder {
      width: 110px;
      height: 110px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #eeeeee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 14px;
    }

    h1 {
      font-size: 30px;
      color: #222;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .register-btn {
      display: inline-block;
      padding: 15px 32px;
      background: #1769aa;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.3s;
    }

    .register-btn:hover {
      background: #0d4f82;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 35px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Foundation Logo -->
    <div class="logo-placeholder">
      CHF Logo
    </div>

    <h1>Charity Hope Foundation</h1>

    <p class="subtitle">
      Welcome to Charity Hope Foundation (CHF)
    </p>

    <a href="#" class="register-btn">
      Member Registration
    </a>

    <div class="footer">
      © 2026 Charity Hope Foundation (CHF)
    </div>

  </div>

</body>
</html>
